# CLI entry point for schema migrations. The app applies them itself on startup via
# ab_dashboard.db.init_db(); this file is for authoring new revisions:
#
#   uv run alembic revision --autogenerate -m "add tasks table"
#   uv run alembic upgrade head
#
# The database URL comes from DATABASE_URL / .env (shared.config), never from this file.

[alembic]
script_location = %(here)s/ab_dashboard/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
