# Local Kokoro TTS, exposed as an OpenAI-compatible /v1/audio/speech endpoint that the
# LiveKit openai plugin talks to directly (see voice_agent/voice_factory.build_tts).
#
#   docker compose -f infra/docker-compose.kokoro.yml up
#
# CPU is the default on purpose. The GPU image wants ~3.1GB of VRAM and an RTX 2050 has
# only 4GB total, which leaves no headroom for anything else on the card. Kokoro is an
# 82M-parameter model, so CPU synthesis keeps up with conversational speech comfortably.
#
# Alternative without Docker: clone remsky/Kokoro-FastAPI and run .\start-cpu.ps1

services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
