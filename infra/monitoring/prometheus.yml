# Scrapes the dashboard running on the host (uv run uvicorn ab_dashboard.main:app).
# host.docker.internal is mapped to the host in docker-compose.monitoring.yml, so this
# works on Linux as well as Docker Desktop.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ar-dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
