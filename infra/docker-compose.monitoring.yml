# Local monitoring stack: Prometheus (metrics + alert rules), Grafana (pre-built
# dashboard) and Jaeger (traces). The dashboard app itself runs on the host.
#
#   docker compose -f infra/docker-compose.monitoring.yml up -d
#
#   # then run the app with traces going to Jaeger:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 LOG_FORMAT=json \
#     uv run --extra observability uvicorn ab_dashboard.main:app --host 0.0.0.0
#
#   Grafana     http://localhost:3000   (anonymous viewer; admin / admin to edit)
#   Prometheus  http://localhost:9090   (Alerts tab shows the rules in alerts.yml)
#   Jaeger      http://localhost:16686

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ar-collections.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.70.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP over HTTP, what the app exports to
