    customer_persona: >
      Finance manager, mildly irritated at being chased for a paid invoice.
    expected_outcome: already_paid
    tags: [low_tier, already_paid]
    invoice:
      invoice_id: INV-200002
      customer:
        customer_id: CUST-3002
        name: Northwind Textiles
        contact_name: Rohit Menon
        gstin: 27PQRSX9876L1Z2
      amount: '112000.00'
      currency: INR
      invoice_date: 2026-06-01
      due_date: 2026-07-01
      days_overdue: 31
      hsn_sac_code: '998313'
      dispute_flag: false
      reminder_count: 2
    customer_script:
      - "We already paid that one."
      - "It went out on the twenty-fourth of July by NEFT."
      - "The UTR is N247811009. Please check with your bank."
      - "I'd rather not go through this again, it's been settled."

