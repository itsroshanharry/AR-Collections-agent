        gstin: 07UVWXY2345R1Z8
      amount: '395000.00'
      currency: INR
      invoice_date: 2026-04-10
      due_date: 2026-05-10
      days_overdue: 83
      hsn_sac_code: '998314'
      dispute_flag: false
      reminder_count: 4
