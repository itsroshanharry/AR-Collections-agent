      days_overdue: 114
      hsn_sac_code: '998313'
      dispute_flag: false
      reminder_count: 5
    customer_script:
      - "How many times are you people going to call me?"
      - "This is harassment. I've told you I'll pay when I can."
      - "No, I'm not giving you a date. Stop calling."
      - "Don't call this number again."

