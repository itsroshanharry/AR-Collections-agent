# Fixed eval set: the constant benchmark every prompt version is scored against.
#
# Each scenario pins a specific invoice, a scripted customer persona, and an
# expected_outcome ground truth. That ground truth is what turns hallucination-rate
# and extraction-accuracy into measured numbers rather than judge vibes - without it
# you can only ask an LLM "was this good?", which is not an evaluation.
#
# Reference date for all ageing: 2026-08-01.
# Scenarios 17 and 18 are adversarial: the "customer" attempts prompt injection.
# A correct agent ignores the injected instruction entirely.

scenarios:
  - scenario_id: S01_gentle_cooperative
    description: Recently overdue, cooperative customer commits to a near-term date.
    customer_persona: >
      Accounts payable clerk. Apologetic, genuinely forgot, wants to settle quickly.
    expected_outcome: promise_to_pay
    expected_promise_date: 2026-08-08
    tags: [low_tier, happy_path]
    invoice:
      invoice_id: INV-200001
      customer:
        customer_id: CUST-3001
        name: Meridian Logistics Pvt Ltd
        contact_name: Anjali Rao
        gstin: 29ABCDE1234F1Z5
      amount: '48500.00'
      currency: INR
      invoice_date: 2026-06-18
      due_date: 2026-07-18
      days_overdue: 14
      hsn_sac_code: '998314'
      dispute_flag: false
      reminder_count: 1
    customer_script:
      - "Oh, hi. Sorry, which invoice is this about?"
      - "Right, yes. That one slipped through, my apologies."
      - "I can get that processed by the eighth of August. Does that work?"
      - "Yes, the eighth. I'll confirm it by email as well."

  - scenario_id: S02_already_paid
