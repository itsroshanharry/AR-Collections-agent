      customer:
        customer_id: CUST-3008
        name: Silverline Pharma
        contact_name: Nisha Bhatt
        gstin: 24KLMNO3344P1Z1
      amount: '675000.00'
      currency: INR
      invoice_date: 2026-03-01
      due_date: 2026-03-31
      days_overdue: 123
      hsn_sac_code: '998314'
      dispute_flag: false
      reminder_count: 5
    customer_script:
      - "I've been meaning to call you back."
      - "It's been a difficult few months, honestly."
      - "Alright. The twelfth of August, I'll make sure it goes out."
      - "Yes, the twelfth. I understand this is the last extension."

