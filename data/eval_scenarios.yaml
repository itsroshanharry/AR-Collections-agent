    customer_persona: >
      US-based AP contact. Cooperative, commits to a date.
    expected_outcome: promise_to_pay
    expected_promise_date: 2026-08-18
    tags: [multi_currency, usd]
    invoice:
      invoice_id: INV-200015
      customer:
        customer_id: CUST-3015
        name: Cedar Ridge Analytics Inc
        contact_name: Marcus Hale
        gstin: null
      amount: '12750.00'
      currency: USD
      invoice_date: 2026-06-10
      due_date: 2026-07-10
