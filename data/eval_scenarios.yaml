      customer:
        customer_id: CUST-3009
        name: Coastal Retail Group
        contact_name: Farah Sheikh
        gstin: 27QRSTU8899V1Z4
      amount: '156000.00'
      currency: INR
      invoice_date: 2026-05-12
      due_date: 2026-06-11
      days_overdue: 51
      hsn_sac_code: '996511'
      dispute_flag: false
      reminder_count: 2
    customer_script:
