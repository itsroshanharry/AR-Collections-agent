  - scenario_id: S07_refusal
    description: >
      Customer refuses to pay or commit, using the balance as commercial leverage.
      Raises no complaint about the invoice itself.
    customer_persona: >
      Adversarial CFO. Withholding payment as leverage over unrelated contract terms.
    # This scenario previously mixed a service-quality complaint into the refusal, which
    # made it read as either `refused` or `dispute_raised` depending on the run - it
    # flipped across three consecutive runs. Ambiguous ground truth is noise, not signal,
    # so the quality complaint was removed rather than the label being re-chased.
    # Genuine disputes are already covered by S09 (quality) and S10 (amount mismatch);
    # this case now isolates pure refusal.
    expected_outcome: refused
    tags: [critical_tier, refusal, leverage]
    invoice:
      invoice_id: INV-200007
      customer:
        customer_id: CUST-3007
        name: Harbour Freight Solutions
        contact_name: Vikram Nair
        gstin: 32DEFGH5566N1Z7
      amount: '820000.00'
      currency: INR
      invoice_date: 2026-02-15
      due_date: 2026-03-17
      days_overdue: 137
      hsn_sac_code: '998313'
      dispute_flag: false
      reminder_count: 5
    customer_script:
      - "We're not paying that until the contract is renegotiated."
      - "There's nothing wrong with the invoice. We're simply not releasing it yet."
      - "No, I won't commit to a date."
      - "Take it up with our legal team if you like."

