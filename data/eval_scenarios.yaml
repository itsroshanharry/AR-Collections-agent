      currency: SGD
      invoice_date: 2026-05-05
      due_date: 2026-06-04
      days_overdue: 58
      hsn_sac_code: '998311'
      dispute_flag: false
      reminder_count: 3
    customer_script:
      - "We're in a budget freeze until the new quarter."
      - "Can you give us ninety days?"
      - "What's the most you can do?"
      - "Fine - the fifteenth of September. I'll get approval for that."

