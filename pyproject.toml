[project]
name = "ar-collections-agent"
version = "0.1.0"
description = "AI collections voice agent + prompt A/B testing dashboard for AR automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "httpx>=0.27",
    "openai>=1.60",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2026.3",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.39.1",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]
voice = [
    "livekit-agents[groq,openai,silero,deepgram]~=1.6",
]
data = [
    "pandas>=2.2",
    "faker>=30.0",
]
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repo is a collection of top-level packages, not an installed distribution
# (tool.uv package = false), so tests import them from the repo root.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults. Depends(...) in a signature default is
# the documented FastAPI idiom, not a mutable-default bug, so it is excluded rather than
# noqa'd on every endpoint.
ignore = ["B008"]

[tool.uv]
package = false
